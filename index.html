<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger Things RPG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: monospace, sans-serif;
            overflow-x: hidden;
        }
        .vignette {
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
        }
        .spores {
            background-image: radial-gradient(rgba(220, 38, 38, 0.15) 1px, transparent 0);
            background-size: 30px 30px;
        }
        .neon-red {
            color: #ef4444;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5), 0 0 20px rgba(239, 68, 68, 0.2);
        }
        .neon-blue {
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 20px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="spores min-h-screen flex flex-col items-center justify-between p-4 vignette">

    <header class="w-full max-w-2xl flex justify-between items-center mb-6 border-b border-red-950 pb-4">
        <span class="text-xs font-bold text-red-600 tracking-widest uppercase">OSD // PROJECT ARCHIVE</span>
        <span id="status-badge" class="text-xs bg-red-950/50 text-red-400 px-2.5 py-1 rounded border border-red-900/50">СТАТУС: ЗАБЛОКИРОВАНО</span>
    </header>

    <!-- Основной контент -->
    <main class="w-full max-w-2xl bg-black/80 border border-red-950 rounded-xl p-6 shadow-[0_0_30px_rgba(239,68,68,0.15)] relative">

        <!-- Экран 1: Проверка доступа (Вопрос) -->
        <div id="auth-screen" class="space-y-6">
            <div class="flex items-center space-x-2 text-red-500 font-bold text-sm tracking-wider">
                <span>⚠️ТРЕБУЕТСЯ АВТОРИЗАЦИЯ</span>
            </div>
            <p class="text-gray-300 text-sm">Для доступа к архивам Хокинса ответьте на контрольный вопрос:</p>
            <div class="text-base text-white font-bold bg-red-950/30 p-3 rounded border border-red-900/40">
                Какой мой год рождения?
            </div>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="checkAccess(2015)" class="text-left p-3 rounded bg-gray-900/80 border border-gray-800 hover:border-red-600 transition-all cursor-pointer text-sm">2015</button>
                <button onclick="checkAccess(2016)" class="text-left p-3 rounded bg-gray-900/80 border border-gray-800 hover:border-red-600 transition-all cursor-pointer text-sm">2016</button>
                <button onclick="checkAccess(2017)" class="text-left p-3 rounded bg-gray-900/80 border border-gray-800 hover:border-red-600 transition-all cursor-pointer text-sm">2017</button>
                <button onclick="checkAccess(2018)" class="text-left p-3 rounded bg-gray-900/80 border border-gray-800 hover:border-red-600 transition-all cursor-pointer text-sm">2018</button>
            </div>
            <div id="auth-error" class="text-red-500 text-xs font-bold h-6"></div>
        </div>

        <!-- Экран 2: Создание персонажа (Скрыт по умолчанию) -->
        <div id="rpg-screen" class="hidden space-y-6">
            <div class="text-xs font-bold text-red-500 tracking-wider">ПРОТОКОЛ ИДЕНТИФИКАЦИИ УСПЕШЕН</div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2 uppercase">Ваше имя в Хокинсе:</label>
                    <input type="text" id="char-name" placeholder="Введите имя..." class="w-full bg-black/90 border border-red-900/60 rounded p-3 text-sm text-white focus:outline-none focus:border-red-600">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-2 uppercase">Кто девушка Майка?</label>
                    <input type="text" id="char-gf" placeholder="Введите имя..." class="w-full bg-black/90 border border-red-900/60 rounded p-3 text-sm text-white focus:outline-none focus:border-red-600">
                </div>

                <button onclick="startStory()" class="w-full py-3 bg-red-950/60 hover:bg-red-900/80 border border-red-700/80 text-white font-bold rounded transition-all cursor-pointer text-sm tracking-widest neon-red">
                    НАЧАТЬ ИГРУ
                </button>
            </div>
        </div>

        <!-- Экран 3: Сюжет / Результат -->
        <div id="story-screen" class="hidden space-y-6 text-center py-6">
            <div id="story-text" class="text-lg leading-relaxed text-gray-200"></div>
        </div>

        <!-- Пасхалка "ОДИ БОЛЬШЕ НЕТ" (Глитч оверлей) -->
        <div id="glitch-overlay" class="hidden fixed inset-0 bg-black z-50 flex flex-col items-center justify-center p-6 text-center">
            <div class="neon-red text-3xl md:text-5xl font-black tracking-widest uppercase animate-pulse">
                ОДИ БОЛЬШЕ НЕТ
            </div>
            <p class="text-gray-500 text-xs mt-4"> СИСТЕМА ПОВРЕЖДЕНА ИЗНАНКОЙ </p>
        </div>

    </main>

    <footer class="text-xs text-gray-600 mt-4 tracking-widest">
        HAWKINS NATIONAL LABORATORY © 1983
    </footer>

    <script>
        function checkAccess(year) {
            const errorEl = document.getElementById('auth-error');
            if (year === 2017) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('rpg-screen').classList.remove('hidden');
                document.getElementById('status-badge').className = "text-xs bg-green-950/50 text-green-400 px-2.5 py-1 rounded border border-green-900/50";
                document.getElementById('status-badge').textContent = "СТАТУС: ДОСТУП РАЗРЕШЕН";
            } else {
                errorEl.textContent = "ДОСТУП ЗАПРЕЩЕН. НЕВЕРНЫЙ ГОД.";
            }
        }

        function startStory() {
            const name = document.getElementById('char-name').value.trim() || "Странник";
            const gf = document.getElementById('char-gf').value.trim().toLowerCase();

            document.getElementById('rpg-screen').classList.add('hidden');
            const storyScreen = document.getElementById('story-screen');
            const storyText = document.getElementById('story-text');
            storyScreen.classList.remove('hidden');

            if (gf === 'оди' || gf === 'eleven') {
                // Активация пасхалки
                setTimeout(() => {
                    document.getElementById('glitch-overlay').classList.remove('hidden');
                }, 500);
            } else {
                storyText.innerHTML = `Добро пожаловать в Хокинс, <span class="neon-red font-bold">${name}</span>. В лаборатории снова открылся разлом...`;
            }
        }
    </script>
</body>
</html>
